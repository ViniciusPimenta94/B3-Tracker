name: Wake B3 Tracker

on:
  schedule:
    # Horários UTC (BRT = UTC-3). Dois pings mantêm o Render acordado
    # durante cada janela do relatório e evitam disparos na virada da hora.
    - cron: "45,55 11 * * 1-5" # 08:45 e 08:55 BRT; relatório às 09:00
    - cron: "45,55 13 * * 1-5" # 10:45 e 10:55 BRT; relatório às 11:00
    - cron: "45,55 23 * * 1-5" # 20:45 e 20:55 BRT; relatório às 21:00
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Validate service URL
        env:
          RENDER_TRACKER_URL: ${{ secrets.RENDER_TRACKER_URL }}
        run: |
          if [ -z "$RENDER_TRACKER_URL" ]; then
            echo "Configure o secret RENDER_TRACKER_URL com a URL do B3 Tracker no Render."
            exit 1
          fi

      - name: Wake Render service
        env:
          RENDER_TRACKER_URL: ${{ secrets.RENDER_TRACKER_URL }}
        run: >-
          curl --fail --silent --show-error
          --retry 5 --retry-delay 15 --retry-all-errors
          --max-time 120 "$RENDER_TRACKER_URL"
